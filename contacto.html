<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<title>Bimbo | Contáctenos</title>
</head>
<body class="container">
	<header class="row">
		<a href="index.html" class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4 text-center text-lg-start">
			<img src="img/logo.png" alt="Logo de Bimbo" class="logo">
		</a>

		<nav class="navbar navbar-expand-lg navbar-light col-12 col-sm-12 col-md-12 col-lg-8 col-xl-8">
		  <div class="container-fluid">

		    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
		      <span class="navbar-toggler-icon"></span>
		    </button>
		    <div class="collapse navbar-collapse" id="navbarNav">
		      <ul class="navbar-nav ms-auto">
		        <li class="nav-item">
		          <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
		        </li>
		        <li class="nav-item">
		          <a class="nav-link" href="productos.html"><i class="bi bi-basket"></i> Productos</a>
		        </li>
		        <li class="nav-item">
		          <a class="nav-link actual" aria-current="page" href="contacto.html"><i class="bi bi-envelope"></i> Contáctenos</a>
		        </li>
		      </ul>
		    </div>
		  </div>
		</nav>
	</header>

	<main>
		<h1>Haz tu pedido</h1>
		<h2>Llevamos Bimbo a tu casa</h2>
		<p class="parr">Domicilio gratis
		<br>
		En pedidos superiores a $30.000
		</p>
		<section class="row pro">
			<article class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
				<img src="img/osito-moto.jpg" alt="Osito Bimbo repartiendo domicilios en moto" class="img-pedido">
			</article>
			<article class="col-12 col-sm-12 col-md-12 col-lg-8 col-xl-8">
				<form class="for">
				  <div class="form-group">
				    <label for="nombre">Nombre completo</label>
				    <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
				  </div>
				  <div class="form-group">
				    <label for="telefono">Teléfono</label>
				    <input type="tel" class="form-control" id="telefono" placeholder="300 123 4567">
				  </div>
				  <div class="form-group">
				    <label for="correo">Correo electrónico</label>
				    <input type="email" class="form-control" id="correo" placeholder="nombre@ejemplo.com">
				  </div>
				  <div class="form-group">
				    <label for="direccion">Dirección de domicilio</label>
				    <input type="text" class="form-control" id="direccion" placeholder="Calle 123 # 45 - 67, barrio, ciudad">
				  </div>

				  <h4>Productos</h4>
				  <div class="form-group row">
				    <div class="col-8 form-check">
				      <input type="checkbox" class="form-check-input" id="producto1">
				      <label class="form-check-label" for="producto1">Pan Artesano Mantequilla</label>
				    </div>
				    <div class="col-4">
				      <input type="number" class="form-control" id="cantidad1" min="0" value="0" aria-label="Cantidad de Pan Artesano Mantequilla">
				    </div>
				  </div>
				  <div class="form-group row">
				    <div class="col-8 form-check">
				      <input type="checkbox" class="form-check-input" id="producto2">
				      <label class="form-check-label" for="producto2">Rapiditas Mantequilla</label>
				    </div>
				    <div class="col-4">
				      <input type="number" class="form-control" id="cantidad2" min="0" value="0" aria-label="Cantidad de Rapiditas Mantequilla">
				    </div>
				  </div>
				  <div class="form-group row">
				    <div class="col-8 form-check">
				      <input type="checkbox" class="form-check-input" id="producto3">
				      <label class="form-check-label" for="producto3">Pingüinos</label>
				    </div>
				    <div class="col-4">
				      <input type="number" class="form-control" id="cantidad3" min="0" value="0" aria-label="Cantidad de Pingüinos">
				    </div>
				  </div>
				  <div class="form-group row">
				    <div class="col-8 form-check">
				      <input type="checkbox" class="form-check-input" id="producto4">
				      <label class="form-check-label" for="producto4">Donas Bimbo</label>
				    </div>
				    <div class="col-4">
				      <input type="number" class="form-control" id="cantidad4" min="0" value="0" aria-label="Cantidad de Donas Bimbo">
				    </div>
				  </div>
				  <div class="form-group row">
				    <div class="col-8 form-check">
				      <input type="checkbox" class="form-check-input" id="producto5">
				      <label class="form-check-label" for="producto5">Mr. Brown</label>
				    </div>
				    <div class="col-4">
				      <input type="number" class="form-control" id="cantidad5" min="0" value="0" aria-label="Cantidad de Mr. Brown">
				    </div>
				  </div>

				  <div class="form-group">
				    <label for="observaciones">Observaciones del pedido</label>
				    <textarea class="form-control" id="observaciones" rows="3"></textarea>
				  </div>
				  <button type="button" class="btn btn-bimbo">Enviar pedido</button>
				</form>
			</article>
		</section>
	</main>

	<footer class="row">
		<div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
			<h5>Contáctanos</h5>
			<h6>Bogotá, Colombia</h6>
			<h6>Línea de atención: 601 580 3240</h6>
			<h6>servicio@bimbo.com.co</h6>
		</div>
		<div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
			<h5>Síguenos</h5>
			<a href="https://www.facebook.com/"><i class="bi bi-facebook"></i></a>
			<a href="https://www.instagram.com/"><i class="bi bi-instagram"></i></a>
			<a href="https://www.youtube.com/"><i class="bi bi-youtube"></i></a>
			<a href="https://www.x.com/"><i class="bi bi-twitter-x"></i></a>
		</div>
		<div class="col-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
			<h5>Horario de atención</h5>
			<h6>Lunes - Sábado</h6>
			<h6>7.00 a. m. - 7.00 p. m.</h6>
		</div>
	</footer>


	<script src="js/bootstrap.min.js"></script>
</body>
</html>
